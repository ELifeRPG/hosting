name: eliferpg-reforger

networks:
  eliferpg:
    external: true
  reforger:

services:
  bridge:
    image: ${BRIDGE_IMAGE:-ghcr.io/eliferpg/reforger-bridge:latest}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      Kestrel__Endpoints__Public__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Management__Url: http://0.0.0.0:8081
      Backend__BaseUrl: http://backend:8080
      Keycloak__BaseUrl: http://keycloak:8080/
      Keycloak__Realm: eliferpg
      Keycloak__ClientId: ${BRIDGE_CLIENT_ID:-gameserver-dev}
      Keycloak__ClientSecret: ${BRIDGE_CLIENT_SECRET:?set BRIDGE_CLIENT_SECRET in .env}
    networks:
      - eliferpg
      - reforger

  gameserver:
    image: ${GAMESERVER_IMAGE:-ghcr.io/eliferpg/reforger-server:latest}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      SERVER_NAME: ${SERVER_NAME:-ELifeRPG}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SCENARIO_ID: ${SCENARIO_ID:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-32}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      BRIDGE_URL: http://bridge:8080
    ports:
      - ${GAME_PORT:-2001}:2001/udp
      - ${A2S_PORT:-17777}:17777/udp
    volumes:
      - server:/reforger/server
      - profile:/reforger/profile
      - ./mods.json:/reforger/mods.json:ro
    depends_on:
      - bridge
    networks:
      - reforger

volumes:
  server:
  profile:
