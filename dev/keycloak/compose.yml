name: eliferpg-keycloak

networks:
  eliferpg:
    external: true

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-ghcr.io/eliferpg/keycloak:latest}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_HOSTNAME: https://${AUTH_HOST:?set AUTH_HOST in .env}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
      KC_ACCOUNT_SERVICE_SECRET: ${KC_ACCOUNT_SERVICE_SECRET:?set KC_ACCOUNT_SERVICE_SECRET in .env}
      KC_PORTAL_SECRET: ${KC_PORTAL_SECRET:?set KC_PORTAL_SECRET in .env}
      KC_GAMESERVER_SECRET: ${KC_GAMESERVER_SECRET:?set KC_GAMESERVER_SECRET in .env}
      KC_STAFF_SECRET: ${KC_STAFF_SECRET:?set KC_STAFF_SECRET in .env}
      PORTAL_HOST: ${PORTAL_HOST:?set PORTAL_HOST in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./import:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - eliferpg
